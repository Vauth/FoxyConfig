name: Verify Config

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-config-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification and update README
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify.py --config config.json --output-report report.md --readme README.md

      - name: Publish to Job Summary
        if: always()
        shell: bash
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push README updates
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain README.md | grep -q "README.md"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "$COMMIT_DATE"
            git push
            echo "Successfully committed and pushed updated README.md ($COMMIT_DATE)"
          else
            echo "README.md is already up to date. No commit needed."
          fi
